name: Daily EOD update

on:
  schedule:
    - cron: "15 22 * * 1-5" # after the US close (6:15pm ET summer / 5:15pm ET winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Commit new labels
        run: |
          git config user.name "god's-eye-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet || git commit -m "EOD update $(date -u +%F)"
          git push
