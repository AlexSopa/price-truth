name: Market update (your own copy)
# Runs only in forks / copies of this repo, for the owner's personal use. It never runs in the original repo:
# the public site uses each viewer's own free data key instead.

on:
  schedule:
    - cron: "20 * * * 1-5" # hourly on weekdays: every region's bar in force, open sessions included
    - cron: "20 21-23 * * 0" # Sunday evening UTC: New Zealand and Australia open Monday
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: market-update
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'AlexSopa/price-truth'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Commit new labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/signals.json
          git diff --cached --quiet && exit 0
          git commit -m "Market update $(date -u +'%F %H:%M') UTC"
          git pull --rebase
          git push
      - name: Keep the schedule on (GitHub turns off schedules after 60 quiet days)
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
